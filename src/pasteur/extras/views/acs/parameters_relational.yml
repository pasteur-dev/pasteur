tables:
  household:
    primary_key: SERIALNO

    fields:
      SERIALNO: id
      # state: categorical
      year: ordinal
      ST: categorical?
      # PUMA: categorical
      NP: numerical
      # HINCP: numerical?
      # FINCP: numerical?
      TYPE: categorical?       # unified TYPE (≤2021) + TYPEHUGQ (2022+); same {1,2,3} codes
      BLD: categorical?
      TEN: categorical?
      VEH: numerical?
      YRBLT: categorical?      # decade-of-build; YBL (≤2019) downsampled to YRBLT's decade bins
      HHL: categorical?
      HHT: categorical?
      HUPAC: categorical?
      FS: categorical?
      ACR: categorical?
      BDSP: numerical?
      RMSP: numerical?
      # VALP: numerical?
      RNTP: ordinal?
      BROADBND: categorical?
      ACCESS: categorical?

  person:
    primary_key: id

    fields:
      id: id
      SERIALNO: id:household.SERIALNO
      # state: categorical # duped
      # year: ordinal # duped
      # ST: categorical? # duped (household.ST is the same; person inherits state)
      # PUMA: categorical # duped (household.PUMA is the same; person inherits geo)
      PWGTP: numerical
      SPORDER: ordinal
      AGEP: numerical
      COW: categorical?
      SCHL: ordinal?
      MAR: categorical
      # OCCP: categorical?
      # POBP: categorical?
      # POWPUMA: categorical?
      RELP: categorical?       # unified RELP (≤2018) + RELSHIPP (2019+) projected onto RELP's 0-17 codes
      WKHP: numerical?
      SEX: categorical?
      RAC1P: categorical?
      PINCP: numerical?
      PUBCOV: categorical?
      ESR: categorical?
      DIS: categorical?
      ESP: categorical?
      CIT: categorical
      MIG: categorical?
      MIL: categorical?
      ANC: categorical?
      NATIVITY: categorical?
      DEAR: categorical
      DEYE: categorical
      DREM: categorical?
      FER: categorical?
      GCL: categorical?
      JWMNP: numerical?
      JWTR: categorical?       # unified JWTR (≤2018) + JWTRNS (2019+); rail variants collapsed to code 3
      POVPIP: numerical?
      NWLA: categorical?
      NWAB: categorical?
      NWAV: categorical?
      NWLK: categorical?
      NWRE: categorical?

ratios:
  wrk: 0.8
  ref: 0.2
